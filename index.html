<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1B1035">
<title>Répertoire des courses longue distance — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1035;
    --text:#F3EEFF; --muted:#B2A6D6; --faint:#8578AD;
    --acc:#8B6BF0; --acc2:#3FD8C8; --accSoft:#B9A5FF;

    /* épaisseurs de verre — la hiérarchie tient à ça, pas à la couleur */
    --g1:rgba(255,255,255,.06);   /* film mince : fiches */
    --g2:rgba(255,255,255,.10);   /* verre moyen : panneaux */
    --g3:rgba(255,255,255,.14);   /* verre épais : chrome flottant */
    --lip:rgba(255,255,255,.22);  /* lèvre lumineuse en haut du verre */
    --edge:rgba(255,255,255,.13);
    --shade:0 10px 34px rgba(12,5,34,.42);

    --swim:#5CD6E0; --bike:#E9B96B; --run:#E58AA8;
    --im:#A98CFF; --ch:#3FD8C8; --xt:#FF9E5C; --ind:#FF8FB8;
    --easy:#3FD8C8; --mid:#E9B96B; --hard:#FF7A8A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100%;
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.5;font-weight:400;
    padding-bottom:56px;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(70vw 60vw at 12% 0%,  rgba(139,107,240,.30), transparent 64%),
      radial-gradient(60vw 55vw at 88% 96%, rgba(214,104,186,.20), transparent 62%),
      var(--bg);
    background-attachment:fixed;
  }
  /* grille de points animée : la seule couche en mouvement de la page */
  #bgdots{position:fixed;inset:0;z-index:-1;pointer-events:none;display:block}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px}
  ::selection{background:rgba(139,107,240,.45);color:#fff}

  /* ---------- Verre ---------- */
  .glass{
    background:linear-gradient(180deg, var(--g3), rgba(255,255,255,.07));
    backdrop-filter:blur(26px) saturate(150%);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    box-shadow:var(--shade), inset 0 1px 0 var(--lip);
    border-radius:20px;
  }

  /* ---------- En-tête ---------- */
  header.mast{padding:22px 0 26px}
  .toprow{display:flex;justify-content:flex-end;margin-bottom:22px}
  .langsel{
    display:inline-flex;gap:2px;padding:3px;border-radius:12px;
    background:var(--g2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:inset 0 1px 0 var(--lip), 0 4px 16px rgba(12,5,34,.3);
  }
  .langsel button{
    background:transparent;border:0;border-radius:9px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;
    color:var(--faint);padding:6px 10px;line-height:1;
    transition:color .16s ease, background .16s ease;
  }
  .langsel button:hover{color:var(--text)}
  .langsel button.on{background:rgba(255,255,255,.16);color:var(--text);box-shadow:inset 0 1px 0 var(--lip)}

  .eyebrow{
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accSoft);margin-bottom:14px;
  }
  h1{
    font-weight:700;font-size:clamp(36px,8.4vw,68px);line-height:.94;
    letter-spacing:-.035em;
  }
  h1 .thin{color:var(--muted);font-weight:600}
  .sub{color:var(--muted);margin-top:16px;max-width:62ch;font-size:15px;line-height:1.6}

  .counts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .pill{
    border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--muted);
    background:var(--g1);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
    font-variant-numeric:tabular-nums;
  }
  .pill b{color:var(--text);font-weight:600}
  .pill.k-IM b{color:var(--im)} .pill.k-CH b{color:var(--ch)}
  .pill.k-XT b{color:var(--xt)} .pill.k-IND b{color:var(--ind)}

  /* ---------- Barre d'outils : le verre le plus épais ---------- */
  .toolbar{
    position:sticky;top:10px;z-index:30;margin-bottom:8px;
    padding:14px 16px;border-radius:22px;
    background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.08));
    backdrop-filter:blur(30px) saturate(160%);
    -webkit-backdrop-filter:blur(30px) saturate(160%);
    box-shadow:var(--shade), inset 0 1px 0 var(--lip);
  }
  .segrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .seg button{
    background:transparent;border:0;border-radius:9px;color:var(--muted);cursor:pointer;
    font-family:inherit;font-weight:600;font-size:13px;padding:8px 15px;line-height:1;
    transition:color .16s ease, background .16s ease;
  }
  .seg button:hover{color:var(--text)}
  .seg button.on{background:rgba(139,107,240,.55);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .seg.view button.on{background:rgba(255,255,255,.20);color:var(--text)}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{
    font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);padding-left:3px;
  }
  select,input[type=search]{
    background:rgba(255,255,255,.09);color:var(--text);border:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
    border-radius:11px;padding:10px 12px;font-family:inherit;font-size:13.5px;font-weight:500;
    min-width:132px;appearance:none;cursor:pointer;
  }
  select option{background:#241748;color:var(--text)}
  input[type=search]{cursor:text;min-width:170px}
  input[type=search]::placeholder{color:var(--faint)}
  select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{
    outline:2px solid var(--acc2);outline-offset:2px;
  }
  .field.search{flex:1 1 170px}
  .field.search input{width:100%}
  .reset{
    background:rgba(255,255,255,.06);border:0;color:var(--muted);border-radius:11px;
    padding:10px 14px;cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit;height:39px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:color .16s ease,background .16s ease;
  }
  .reset:hover{color:var(--text);background:rgba(255,255,255,.11)}

  .sortbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .sortbar .lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:3px}
  .sortchip{
    background:rgba(255,255,255,.06);border:0;color:var(--muted);border-radius:10px;
    padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);transition:color .16s ease,background .16s ease;
  }
  .sortchip:hover{color:var(--text);background:rgba(255,255,255,.10)}
  .sortchip.on{background:rgba(63,216,200,.18);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.20)}
  .sortchip .arr{font-size:10px;color:var(--acc2);width:8px;display:inline-block}

  .meta-row{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px;flex-wrap:wrap;gap:8px;padding:0 4px}
  .resultcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .resultcount b{color:var(--text);font-weight:700}
  .note{font-size:11.5px;color:var(--faint)}

  /* ---------- Carte : le geste signature ---------- */
  .mapwrap{
    position:relative;border-radius:22px;overflow:hidden;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:var(--shade), inset 0 1px 0 var(--lip);
  }
  .mapwrap svg.world{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
  .mapwrap svg.world.drag{cursor:grabbing}
  /* continents en verre dépoli, océans laissant passer la lumière du fond */
  .land{fill:rgba(255,255,255,.085);stroke:rgba(255,255,255,.20);stroke-width:1;vector-effect:non-scaling-stroke}
  .grat{stroke:rgba(255,255,255,.07);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
  .pt{cursor:pointer;stroke:rgba(27,16,53,.85);stroke-width:1.2;vector-effect:non-scaling-stroke;transition:stroke .15s ease}
  .pt:hover,.pt.sel{stroke:#fff;stroke-width:2.4}

  .maplegend{
    position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;
    padding:8px 12px;border-radius:13px;font-size:11px;font-weight:500;color:var(--muted);
    background:rgba(27,16,53,.42);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  }
  .maplegend span{display:inline-flex;align-items:center;gap:6px}
  .maplegend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .maphint{
    position:absolute;right:12px;top:12px;font-size:11px;font-weight:500;color:var(--muted);
    padding:7px 12px;border-radius:13px;
    background:rgba(27,16,53,.42);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  }
  .mapctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .mapctl button{
    width:36px;height:36px;border-radius:12px;border:0;color:var(--text);
    background:rgba(27,16,53,.46);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
    font-size:17px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;transition:background .16s ease;
  }
  .mapctl button:hover{background:rgba(139,107,240,.55)}

  /* infobulle : le verre le plus épais de la page */
  .maptip{
    position:absolute;pointer-events:none;z-index:9;opacity:0;visibility:hidden;
    max-width:250px;padding:11px 13px;border-radius:16px;
    background:rgba(41,26,80,.62);
    backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);
    box-shadow:0 14px 40px rgba(10,4,30,.55), inset 0 1px 0 rgba(255,255,255,.26);
    transition:opacity .14s ease;
  }
  .maptip.on{opacity:1;visibility:visible}
  .maptip .tt-n{font-weight:700;font-size:13.5px;line-height:1.25;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
  .maptip .tt-n i{width:8px;height:8px;border-radius:50%;flex:none}
  .maptip .tt-m{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6;font-variant-numeric:tabular-nums}
  .maptip .tt-m b{color:var(--text);font-weight:600}
  .maptip .tt-go{font-size:10px;font-weight:600;color:var(--acc2);margin-top:8px;letter-spacing:.06em}

  .popup{
    margin-top:12px;padding:16px;border-radius:22px;display:none;
    background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
    backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
    box-shadow:var(--shade), inset 0 1px 0 var(--lip);
  }
  .popup.on{display:block}
  .popup h3{
    font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);
    margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .popup .close{
    background:rgba(255,255,255,.09);border:0;color:var(--muted);border-radius:10px;cursor:pointer;
    font-size:11.5px;font-weight:500;padding:6px 12px;font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  }
  .popup .close:hover{color:var(--text);background:rgba(255,255,255,.14)}
  .plist{display:flex;flex-direction:column;gap:10px}

  /* ---------- Fiches : film de verre mince ---------- */
  .colhead{
    display:none;grid-template-columns:74px minmax(140px,1fr) 150px 150px 150px 70px;
    gap:13px;align-items:center;padding:0 18px 10px;
    font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  }
  .colhead span:nth-child(3){color:var(--swim)}
  .colhead span:nth-child(4){color:var(--bike)}
  .colhead span:nth-child(5){color:var(--run)}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{
    position:relative;border-radius:18px;padding:15px 17px;display:grid;gap:12px;
    grid-template-columns:repeat(3,1fr);
    grid-template-areas:"date date diff" "main main main" "swim bike run";
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05)), rgba(38,24,74,.62);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 4px 18px rgba(12,5,34,.22);
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.07)), rgba(46,29,88,.60);
    box-shadow:inset 0 1px 0 var(--lip), 0 10px 30px rgba(12,5,34,.36);
  }
  /* la série se lit à un liseré lumineux, pas à une bordure */
  .card::before{
    content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;
    background:var(--sc,transparent);box-shadow:0 0 14px 0 var(--sc,transparent);opacity:.9;
  }
  .card.s-IM{--sc:var(--im)} .card.s-CH{--sc:var(--ch)}
  .card.s-XT{--sc:var(--xt)} .card.s-IND{--sc:var(--ind)}

  .c-date{grid-area:date;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .c-date .dnum{color:var(--text);font-weight:600}
  .badge{
    font-size:10px;font-weight:600;letter-spacing:.05em;border-radius:7px;padding:4px 8px;
    color:var(--muted);background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);white-space:nowrap;
  }
  .badge.F{color:var(--text)}
  .badge.H{color:var(--muted)}

  .c-main{grid-area:main;min-width:0}
  .rname{font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.015em}
  .serie{
    font-size:10px;font-weight:600;letter-spacing:.06em;padding:3px 7px;border-radius:7px;
    margin-left:8px;vertical-align:middle;white-space:nowrap;
  }
  .serie.IM{color:var(--im);background:rgba(169,140,255,.20)}
  .serie.CH{color:var(--ch);background:rgba(63,216,200,.16)}
  .serie.XT{color:var(--xt);background:rgba(255,158,92,.18)}
  .serie.IND{color:var(--ind);background:rgba(255,143,184,.16)}
  .rmeta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rmeta .flag{font-size:14px}

  .links{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .links a{
    font-size:11px;font-weight:500;text-decoration:none;border-radius:8px;padding:5px 10px;
    color:var(--muted);background:rgba(255,255,255,.07);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);white-space:nowrap;transition:color .16s,background .16s;
  }
  .links a:hover{color:var(--text);background:rgba(139,107,240,.42)}
  .links a.primary{color:var(--text)}

  .c-disc{display:flex;flex-direction:column;gap:6px;min-width:0}
  .c-disc.swim{grid-area:swim}.c-disc.bike{grid-area:bike}.c-disc.run{grid-area:run}
  .disc-top{display:flex;align-items:center;justify-content:space-between;gap:5px}
  .disc-key{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .disc-dist{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .glyph{
    display:block;width:100%;height:28px;border-radius:9px;
    background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .disc-bot{display:flex;align-items:baseline;justify-content:space-between;gap:7px;flex-wrap:wrap}
  .disc-val{font-weight:600;font-size:11.5px;letter-spacing:-.01em;white-space:nowrap}
  .swim .disc-val{color:var(--swim)} .bike .disc-val{color:var(--bike)} .run .disc-val{color:var(--run)}
  .disc-elev{font-size:10px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto}

  .c-diff{grid-area:diff;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .diff-lbl{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .meter{display:flex;gap:3px}
  .meter i{width:9px;height:15px;border-radius:3px;background:rgba(255,255,255,.10);display:block}
  .diff-num{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

  .empty{
    padding:60px 20px;text-align:center;color:var(--muted);border-radius:20px;
    background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  }
  .empty b{color:var(--text);display:block;font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}

  /* ---------- Légende ---------- */
  details.legend{
    margin-top:26px;border-radius:20px;overflow:hidden;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 6px 22px rgba(12,5,34,.24);
  }
  details.legend>summary{
    cursor:pointer;list-style:none;padding:16px 20px;
    font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  details.legend>summary::-webkit-details-marker{display:none}
  details.legend>summary .chev{transition:transform .22s ease;color:var(--acc2)}
  details.legend[open]>summary .chev{transform:rotate(180deg)}
  .legend-body{padding:6px 20px 22px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .lg-block h4{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
  .lg-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;color:var(--muted);line-height:1.55}
  .lg-row svg{flex:none}
  .src{margin-top:6px;font-size:11.5px;color:var(--faint);line-height:1.75;grid-column:1/-1}
  .src b{color:var(--muted);font-weight:600}

  /* ---------- Grand écran ---------- */
  @media(min-width:900px){
    .colhead{display:grid}
    .card{
      grid-template-columns:74px minmax(140px,1fr) 150px 150px 150px 70px;
      grid-template-areas:"date main swim bike run diff";
      align-items:center;gap:14px;
    }
    .c-date{flex-direction:column;align-items:flex-start;gap:8px}
    .disc-key{display:none}
    .diff-lbl{display:none}
    .card:hover{transform:translateY(-2px)}
  }
  /* sous 900px la barre de filtres est trop haute pour rester collée */
  @media(max-width:899px){
    .toolbar{position:static;padding:13px 14px}
    .wrap{padding:0 12px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<canvas id="bgdots" aria-hidden="true"></canvas>

<header class="mast">
  <div class="wrap">
    <div class="toprow">
      <div class="langsel" id="seglang" role="group" aria-label="Langue">
        <button data-lg="fr" class="on">FR</button>
        <button data-lg="en">EN</button>
        <button data-lg="de">DE</button>
        <button data-lg="es">ES</button>
      </div>
    </div>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1><span data-i="h1a"></span><br><span class="thin" data-i="h1b"></span></h1>
    <p class="sub" data-i="sub"></p>
    <div class="counts" id="counts"></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="segrow">
      <div class="seg view" id="segview">
        <button data-view="list" class="on" data-i="vList"></button>
        <button data-view="map" data-i="vMap"></button>
      </div>
      <div class="seg" id="segdist">

function runM(r){return r.rm!=null?r.rm:RUN_DEF[r.t][r.rn];}
function diffScore(r){return TO[r.bk]*2 + TO[r.rn]*1.5 + (SWIMMOD[r.sw]||0);}
function diffLevel(r){const s=diffScore(r);return Math.max(1,Math.min(5,Math.round(1+4*(s-3.5)/8)));}
function dSwim(r){return r.sd||(r.t==="F"?"3,8 km":"1,9 km");}
function dBike(r){return r.bd||(r.t==="F"?"180 km":"90 km");}
function dRun(r){ return r.rd||(r.t==="F"?"42,2 km":"21,1 km");}
function fmtM(m){return (""+m).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f")+" m";}
function fmtDate(iso){const p=iso.split("-").map(Number),a=I18N[LG].mAbbr[p[1]-1];
  return LG==="en" ? a+" "+p[2] : p[2]+" "+a;}

const PATHS={
  plat:"M0 24 L0 18.5 L8 18 L16 17.5 L24 18 L32 17.5 L40 18 L48 17.5 L56 18 L64 17.8 L64 24 Z",
  vallonne:"M0 24 L0 16 L8 11.5 L16 15.5 L24 10.5 L32 15.5 L40 11 L48 15.5 L56 11.5 L64 15 L64 24 Z",
  montagneux:"M0 24 L0 15 L8 5.5 L16 13 L24 4 L32 12 L40 5 L48 13.5 L56 6 L64 12.5 L64 24 Z"
};
const LINE={
  plat:"M0 18.5 L8 18 L16 17.5 L24 18 L32 17.5 L40 18 L48 17.5 L56 18 L64 17.8",
  vallonne:"M0 16 L8 11.5 L16 15.5 L24 10.5 L32 15.5 L40 11 L48 15.5 L56 11.5 L64 15",
  montagneux:"M0 15 L8 5.5 L16 13 L24 4 L32 12 L40 5 L48 13.5 L56 6 L64 12.5"
};
function terrainGlyph(t,c){return '<svg class="glyph" viewBox="0 0 64 24" preserveAspectRatio="none" aria-hidden="true"><path d="'+PATHS[t]+'" fill="'+c+'" fill-opacity="0.16"/><path d="'+LINE[t]+'" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';}
function swimGlyph(c){return '<svg class="glyph" viewBox="0 0 64 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 Q8 5 16 10 T32 10 T48 10 T64 10" fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><path d="M0 16 Q8 11 16 16 T32 16 T48 16 T64 16" fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg>';}
const C={swim:"#5CD6E0",bike:"#E9B96B",run:"#E58AA8"};

let state={view:"list",t:"all",mois:"",serie:"",cont:"",sw:"",bk:"",rn:"",q:"",sort:"date",dir:1};

function uniq(a){return [...new Set(a)];}
function fillSelect(id,opts,allLabel){
  document.getElementById(id).innerHTML='<option value="">'+allLabel+'</option>'+opts.map(o=>'<option value="'+o.v+'">'+o.t+'</option>').join("");
}
function buildSelects(){
  const keep={};
  ["f-mois","f-serie","f-cont","f-swim","f-bike","f-run"].forEach(id=>{
    const el=document.getElementById(id); if(el) keep[id]=el.value;
  });
  fillSelect("f-mois",I18N[LG].months.map((m,i)=>{
    const k=String(i+1).padStart(2,"0");
    const n=R.filter(r=>r.d.slice(5,7)===k).length;
    return n?{v:k,t:m+" ("+n+")"}:null;
  }).filter(Boolean),t("allF"));
  fillSelect("f-serie",["IM","CH","XT","IND"].map(k=>({v:k,t:tSerie(k)})),t("allFe"));
  fillSelect("f-cont",["EU","NA","SA","AS","OC","AF"].filter(k=>uniq(R.map(r=>r.ct)).includes(k))
    .map(k=>({v:k,t:tCont(k)})),t("allF"));
  fillSelect("f-swim",uniq(R.map(r=>r.sw)).map(s=>({v:s,t:tSwim(s)}))
    .sort((a,b)=>a.t.localeCompare(b.t)),t("allFe"));
  fillSelect("f-bike",["plat","vallonne","montagneux"].map(k=>({v:k,t:tTerr(k)})),t("allF"));
  fillSelect("f-run",["plat","vallonne","montagneux"].map(k=>({v:k,t:tTerr(k)})),t("allF"));
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id); if(el) el.value=keep[id];});
}

function passes(r){
  if(state.t!=="all" && r.t!==state.t) return false;
  if(state.mois && r.d.slice(5,7)!==state.mois) return false;
  if(state.serie && r.s!==state.serie) return false;
  if(state.cont && r.ct!==state.cont) return false;
  if(state.sw && r.sw!==state.sw) return false;
  if(state.bk && r.bk!==state.bk) return false;
  if(state.rn && r.rn!==state.rn) return false;
  if(state.q){const q=state.q.toLowerCase();if(!(r.n+" "+r.c+" "+r.co).toLowerCase().includes(q)) return false;}
  return true;
}
const SWIMORD={"Lac":1,"Réservoir":2,"Rivière":3,"Baie":4,"Fjord":5,"Océan":6};
function sortKey(r){
  switch(state.sort){
    case"date":return r.d;
    case"diff":return diffScore(r);
    case"bike":return bikeM(r);
    case"run":return runM(r);
    case"swim":return SWIMORD[r.sw]||0;
    case"name":return r.n.toLowerCase();
    case"country":return r.co.toLowerCase();
  }
}
function current(){
  return R.filter(passes).sort((a,b)=>{
    const ka=sortKey(a),kb=sortKey(b);
    if(ka<kb)return -1*state.dir;
    if(ka>kb)return 1*state.dir;
    return a.d<b.d?-1:1;
  });
}
function meterHTML(l){
  const col=l<=2?"var(--easy)":l===3?"var(--mid)":"var(--hard)";
  let s='<div class="meter">';
  for(let i=1;i<=5;i++) s+='<i style="'+(i<=l?'background:'+col:'')+'"></i>';
  return s+'</div>';
}
function discCell(cls,key,label,glyph,dist,elev){
  const DP=(LG==="fr"?"D+ ":LG==="de"?"Hm ":"+");
  const e = elev!=null ? '<span class="disc-elev">'+DP+fmtM(elev)+'</span>' : '';
  return '<div class="c-disc '+cls+'"><div class="disc-top"><span class="disc-key">'+key+'</span><span class="disc-dist">'+dist+'</span></div>'+glyph+
    '<div class="disc-bot"><span class="disc-val">'+label+'</span>'+e+'</div></div>';
}
function cardHTML(r,i){
  const lvl=diffLevel(r);
  const dcol=lvl<=2?'var(--easy)':lvl===3?'var(--mid)':'var(--hard)';
  const badge='<span class="badge '+r.t+'">'+(r.t==="F"?t("dLong"):t("dMid"))+'</span>';
  return '<div class="card s-'+r.s+'" id="card-'+r.id+'">'+
    '<div class="c-date">'+badge+'<span class="dnum">'+(r.a?"~":"")+fmtDate(r.d)+'</span></div>'+
    '<div class="c-main"><div class="rname">'+r.n+'<span class="serie '+r.s+'">'+tSerie(r.s)+'</span></div>'+
      '<div class="rmeta"><span class="flag">'+r.fl+'</span> '+r.c+' · '+tCo(r.co)+' · '+tCont(r.ct)+'</div>'+linksHTML(r)+'</div>'+
    discCell("swim",t("kSwim"),tSwim(r.sw),swimGlyph(C.swim),dSwim(r),null)+
    discCell("bike",t("kBike"),tTerr(r.bk),terrainGlyph(r.bk,C.bike),dBike(r),bikeM(r))+
    discCell("run",t("kRun"),tTerr(r.rn),terrainGlyph(r.rn,C.run),dRun(r),runM(r))+
    '<div class="c-diff"><span class="diff-lbl">Diff.</span>'+meterHTML(lvl)+'<span class="diff-num" style="color:'+dcol+'">'+lvl+'/5</span></div>'+
  '</div>';
}

function linksHTML(r){
  const q=encodeURIComponent(r.n+" triathlon 2026");
  const search='<a href="https://duckduckgo.com/?q='+q+'" target="_blank" rel="noopener">'+t("search")+' ↗</a>';
  const site=r.u?'<a class="primary" href="'+r.u+'" target="_blank" rel="noopener">'+t("site")+' ↗</a>':'';
  return '<div class="links">'+site+search+'</div>';
}

/* ---------- Map ---------- */
const MW=1440,MH=720;
function mx(lon){return (lon+180)/360*MW;}
function my(lat){return (90-lat)/180*MH;}
function drawGraticule(){
  let d="";
  for(let lon=-150;lon<=150;lon+=30){const x=mx(lon).toFixed(0);d+="M"+x+" 40L"+x+" 560";}
  for(let lat=-40;lat<=80;lat+=20){const y=my(lat).toFixed(0);d+="M0 "+y+"L1440 "+y;}
  document.getElementById("grat").innerHTML='<path class="grat" d="'+d+'"/>';
}
const SVG=document.querySelector("svg.world");
const BASE={x:0,y:40,w:1440,h:520};
let vb={x:0,y:40,w:1440,h:520};
const MAXZ=14;
function applyVB(){
  const rd=n=>Math.round(n*100)/100;
  SVG.setAttribute("viewBox",rd(vb.x)+" "+rd(vb.y)+" "+rd(vb.w)+" "+rd(vb.h));
  const k=Math.max(vb.w/BASE.w,1/MAXZ);
  document.querySelectorAll("#pts .pt").forEach(c=>c.setAttribute("r",(+c.dataset.r)*k));
}
function clampVB(){
  vb.w=Math.min(BASE.w,Math.max(BASE.w/MAXZ,vb.w));
  vb.h=vb.w*(BASE.h/BASE.w);
  vb.x=Math.max(-30,Math.min(BASE.w+30-vb.w,vb.x));
  vb.y=Math.max(BASE.y-30,Math.min(BASE.y+BASE.h+30-vb.h,vb.y));
}
function zoomAt(fx,fy,factor){
  const rx=(fx-vb.x)/vb.w, ry=(fy-vb.y)/vb.h;
  vb.w=Math.min(BASE.w,Math.max(BASE.w/MAXZ,vb.w*factor));
  vb.h=vb.w*(BASE.h/BASE.w);
  vb.x=fx-rx*vb.w; vb.y=fy-ry*vb.h;
  clampVB(); applyVB();
}
function toUser(cx,cy){
  const b=SVG.getBoundingClientRect();
  return [ vb.x+(cx-b.left)/b.width*vb.w, vb.y+(cy-b.top)/b.height*vb.h ];
}
SVG.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=toUser(e.clientX,e.clientY);
  zoomAt(p[0],p[1], e.deltaY>0 ? 1.18 : 1/1.18);
},{passive:false});
let drag=null, moved=0, pinch=null;
let pressed=null;                       // le point sur lequel l'appui a commence
SVG.addEventListener("pointerdown",e=>{
  if(pinch)return;
  pressed=e.target.closest(".pt");
  drag={cx:e.clientX,cy:e.clientY,vx:vb.x,vy:vb.y,pid:e.pointerId,cap:false}; moved=0;
  SVG.classList.add("drag");
});
SVG.addEventListener("pointermove",e=>{
  if(!drag||pinch)return;
  const b=SVG.getBoundingClientRect();
  moved=Math.max(moved,Math.abs(e.clientX-drag.cx)+Math.abs(e.clientY-drag.cy));
  // capturer seulement une fois le glisser engage : sinon la capture vole la cible du clic
  if(!drag.cap && moved>4 && SVG.setPointerCapture){
    try{SVG.setPointerCapture(drag.pid);}catch(_){}
    drag.cap=true; pressed=null; hideTip();
  }
  vb.x=drag.vx-(e.clientX-drag.cx)/b.width*vb.w;
  vb.y=drag.vy-(e.clientY-drag.cy)/b.height*vb.h;
  clampVB(); applyVB();
});
// selection au relachement : fiable meme si la capture a redirige le clic
SVG.addEventListener("pointerup",e=>{
  if(pressed && moved<=4) selectPoint(pressed);
  pressed=null;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>
  SVG.addEventListener(ev,()=>{drag=null;SVG.classList.remove("drag");}));
SVG.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    drag=null;
    const a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  }
},{passive:true});
SVG.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&pinch){
    e.preventDefault();
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const p=toUser((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);
    if(pinch.d>0&&d>0) zoomAt(p[0],p[1],pinch.d/d);
    pinch.d=d;
  }
},{passive:false});
SVG.addEventListener("touchend",e=>{ if(e.touches.length<2) pinch=null; },{passive:true});
function zc(f){zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,f);}
document.getElementById("z-in").addEventListener("click",()=>zc(1/1.6));
document.getElementById("z-out").addEventListener("click",()=>zc(1.6));
document.getElementById("z-reset").addEventListener("click",()=>{vb={x:0,y:40,w:1440,h:520};applyVB();});

function renderMap(rows){
  const g=document.getElementById("pts");
  let s="";
  rows.forEach(r=>{
    const x=mx(r.lo).toFixed(1), y=my(r.la).toFixed(1);
    const rad=r.t==="F"?5.2:3.6;
    s+='<circle class="pt" data-id="'+r.id+'" data-r="'+rad+'" cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+SCOL[r.s]+'" fill-opacity="0.85"></circle>';
  });
  g.innerHTML=s;
  hideTip();
  applyVB();

const TIP=document.getElementById("maptip"), WRAP=document.querySelector(".mapwrap");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function hideTip(){TIP.classList.remove("on");}
function showTip(circle){
  const cx=+circle.getAttribute("cx"), cy=+circle.getAttribute("cy");
  const tol=2.5*Math.max(vb.w/BASE.w,0.16);
  const grp=current().filter(r=>Math.abs(mx(r.lo)-cx)<tol && Math.abs(my(r.la)-cy)<tol);
  if(!grp.length) return;
  const r=grp[0];
  const extra=grp.length>1 ? '<div class="tt-m">+ '+(grp.length-1)+' '+(grp.length>2?t("ttMoreN"):t("ttMore1"))+'</div>' : '';
  TIP.innerHTML=
    '<div class="tt-n"><i style="background:'+SCOL[r.s]+'"></i>'+esc(r.n)+'</div>'+
    '<div class="tt-m">'+(r.a?"~":"")+fmtDate(r.d)+' · '+(r.t==="F"?t("dLong"):t("dMid"))+'<br>'+
      esc(r.c)+', '+esc(tCo(r.co))+'<br>'+
      t("kBike")+' <b>'+tTerr(r.bk)+'</b> · '+fmtM(bikeM(r))+'<br>'+
      t("kRun")+' <b>'+tTerr(r.rn)+'</b> · '+t("kSwim")+' '+tSwim(r.sw)+'</div>'+
    extra+
    '<div class="tt-go">'+t("ttGo")+'</div>';
  // mesurer et positionner AVANT de rendre visible (evite un flash a l'ancienne position)
  const cb=circle.getBoundingClientRect(), wb=WRAP.getBoundingClientRect();
  const px=cb.left-wb.left+cb.width/2, py=cb.top-wb.top;
  const tw=TIP.offsetWidth, th=TIP.offsetHeight;
  let left=px-tw/2, top=py-th-10;
  left=Math.max(6,Math.min(wb.width-tw-6,left));
  if(top<6) top=py+cb.height+10;
  TIP.style.left=left+"px"; TIP.style.top=top+"px";
  TIP.classList.add("on");
}
document.getElementById("pts").addEventListener("pointerover",e=>{
  if(e.pointerType && e.pointerType!=="mouse") return;
  const c=e.target.closest(".pt"); if(!c||drag) return;
  showTip(c);
});
document.getElementById("pts").addEventListener("pointerout",e=>{
  if(e.target.closest(".pt")) hideTip();
});
SVG.addEventListener("pointerdown",hideTip);
SVG.addEventListener("wheel",hideTip,{passive:true});
SVG.addEventListener("pointerleave",hideTip);

function selectPoint(c){
  if(!c) return;
  hideTip();
  document.querySelectorAll(".pt.sel").forEach(n=>n.classList.remove("sel"));
  const cx=+c.getAttribute("cx"), cy=+c.getAttribute("cy");
  const tol=2.5*Math.max(vb.w/BASE.w,0.16);
  const rows=current().filter(r=>Math.abs(mx(r.lo)-cx)<tol && Math.abs(my(r.la)-cy)<tol);
  if(!rows.length) return;
  rows.forEach(r=>{const n=document.querySelector('.pt[data-id="'+r.id+'"]');if(n)n.classList.add("sel");});
  showPopup(rows, rows.length>1 ? rows.length+" "+t("races")+" · "+rows[0].c : rows[0].c+", "+tCo(rows[0].co));
}
// filet de securite : si le navigateur delivre bien un clic sur le cercle
document.getElementById("pts").addEventListener("click",e=>{

  if(c && moved<=4) selectPoint(c);
});

/* ---------------- Fond : grille de points sur champ coloré mouvant ----------------
   Chaque point prend sa couleur dans un champ qui dérive lentement.
   Les points sont regroupés par teinte pour ne changer fillStyle qu'une douzaine
   de fois par image, au lieu d'une fois par point. */
(function(){
  const cv=document.getElementById("bgdots");
  if(!cv||!cv.getContext) return;
  const ctx=cv.getContext("2d",{alpha:true});
  if(!ctx){cv.style.display="none";return;}   // contexte 2D indisponible : on s'efface proprement
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // violet accent → magenta → turquoise
  const STOPS=[[139,107,240],[214,104,186],[63,216,200]];
  const BUCKETS=12;
  const PAL=[];
  for(let i=0;i<BUCKETS;i++){
    const u=i/(BUCKETS-1);
    let a,b,k;
    if(u<0.5){a=STOPS[0];b=STOPS[1];k=u/0.5;} else {a=STOPS[1];b=STOPS[2];k=(u-0.5)/0.5;}
    PAL.push("rgb("+Math.round(a[0]+(b[0]-a[0])*k)+","
                   +Math.round(a[1]+(b[1]-a[1])*k)+","
                   +Math.round(a[2]+(b[2]-a[2])*k)+")");
  }

  let W=0,H=0,dpr=1,step=26,cols=0,rows=0;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    step=W<620?14:16;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cols=Math.ceil(W/step)+1; rows=Math.ceil(H/step)+1;
  }

  function frame(ms){
    const t=ms*0.00016;
    ctx.clearRect(0,0,W,H);
    const paths=[]; for(let i=0;i<BUCKETS;i++) paths.push(new Path2D());
    for(let r=0;r<rows;r++){
      const y=r*step;
      for(let c=0;c<cols;c++){
        const x=c*step;
        // champ de teinte : trois ondes lentes désynchronisées
        const n=Math.sin(x*0.0060+t*1.10)
               +Math.sin(y*0.0068-t*0.82)
               +Math.sin((x+y)*0.0037+t*0.55);
        const u=(n+3)/6;
        // champ d'intensité : pilote le rayon, d'où la sensation de respiration
        const b=0.5+0.5*Math.sin((x-y)*0.0034-t*1.35+Math.sin(y*0.002+t*0.4));
        const rad=0.18+0.62*b*b;
        let idx=(u*BUCKETS)|0; if(idx<0)idx=0; if(idx>=BUCKETS)idx=BUCKETS-1;
        // sous ~1,3 px un carré et un disque sont indiscernables :
        // rect() est bien moins coûteux à tracer que arc()
        const s=rad*2;
        paths[idx].rect(x-rad,y-rad,s,s);
      }
    }
    for(let i=0;i<BUCKETS;i++){
      ctx.fillStyle=PAL[i];
      ctx.globalAlpha=0.52;
      ctx.fill(paths[i]);
    }
    ctx.globalAlpha=1;
  }

  let raf=null,running=false;
  function loop(ms){ frame(ms); raf=requestAnimationFrame(loop); }
  function start(){ if(running||reduce)return; running=true; raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf)cancelAnimationFrame(raf); raf=null; }

  resize(); frame(0);
  start();
  let rt=null;
  window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{resize();frame(performance.now());},160);});
  document.addEventListener("visibilitychange",()=>{document.hidden?stop():start();});
})();

</script>
</body>
</html>
